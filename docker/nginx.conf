server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 210M;

    # Re-resolve container names so recreated containers are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    set $reverb_upstream http://reverb:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded files are served as static content and never executed.
    location ^~ /storage/ {
        try_files $uri =404;
        location ~ \.php$ { return 403; }
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location /app {
        # Reverb websocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_pass $reverb_upstream;
    }

    location ~ /\.(?!well-known) { deny all; }
}
