# Full SoleGlance stack. Copy .env.example to .env, set DB_* to the values
# below, then:  docker compose up -d --build
#               docker compose exec app php artisan migrate --seed
x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: app
    args: &vite
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
      VITE_REVERB_HOST: ${PUBLIC_HOST:-localhost}
      VITE_REVERB_PORT: ${APP_PORT:-8000}
      VITE_REVERB_SCHEME: ${PUBLIC_SCHEME:-http}
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_DATABASE: soleglance
    DB_USERNAME: soleglance
    DB_PASSWORD: ${DB_PASSWORD:-change-me}
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    ANALYTICS_URL: http://analytics:8001
    # The app talks to Reverb inside the Docker network; browsers reach it through nginx.
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
  volumes:
    - storage:/var/www/html/storage
  depends_on: [mysql, redis]
  restart: unless-stopped

services:
  app:
    <<: *app
    # Cache config, routes and views on start for production performance.
    command: sh -c "php artisan app:bootstrap && php artisan optimize && exec php-fpm"

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: web
      args: *vite
    ports: ["${APP_PORT:-8000}:80"]
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on: [app, reverb]
    restart: unless-stopped

  analytics:
    build: ./analytics
    environment:
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN}
      SENTIMENT_BACKEND: ${SENTIMENT_BACKEND:-routed}
    volumes:
      - hf-cache:/models/hf
      - analytics-models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 600s
      retries: 3
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: soleglance
      MYSQL_USER: soleglance
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: [mysql:/var/lib/mysql]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Local catch-all inbox: every e-mail the app sends appears at
  # http://localhost:8025 and nothing leaves the machine. For production,
  # point MAIL_* in .env at a real SMTP provider and remove this service.
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped

volumes:
  analytics-models:
  storage:
  mysql:
  hf-cache:
