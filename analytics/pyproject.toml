[project]
name = "soleglance-analytics"
version = "2.0.0"
description = "Language identification, multilingual sentiment, topic and trend analytics for SoleGlance"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "vaderSentiment>=3.3.2",
    "textblob>=0.18",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.3",
    "sentencepiece>=0.2",
    "protobuf>=4",
]

[project.optional-dependencies]
research = ["pandas>=2.2", "datasets>=2.20", "requests>=2.32", "matplotlib>=3.9", "scipy>=1.13"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["soleglance_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
